<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betül Aydın Kokular - Yazılım Mühendisi & Veri Bilimi Uzmanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --dark: #0f172a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
        }

        .header-container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #93c5fd;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .contact-item {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            background: var(--primary);
            color: white;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            color: var(--dark);
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .section-header i {
            color: var(--primary);
        }

        .badge-active {
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .experience-item, .education-item {
            margin-bottom: 25px;
            padding-left: 20px;
            border-left: 3px solid #cbd5e1;
            position: relative;
        }

        .experience-item:last-child, .education-item:last-child {
            margin-bottom: 0;
        }

        .experience-item::before, .education-item::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 4px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background-color: var(--primary);
        }

        .item-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--dark);
        }

        .item-company {
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 1rem;
        }

        .item-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .project-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .project-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
