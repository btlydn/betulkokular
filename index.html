<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betül Aydın Kokular | Bilgisayar Mühendisi & Veri Bilimi Uzmanı</title>
    <!-- FontAwesome Icon Library -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #0f172a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-heading: #0f172a;
            --border-color: #e2e8f0;
            --accent-blue: #eff6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 60px 20px 40px;
            text-align: center;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #93c5fd;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .contact-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--text-heading);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        .badge-active {
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: auto;
        }

        .timeline-item {
            position: relative;
            padding-left: 25px;
            margin-bottom: 30px;
            border-left: 2px solid #cbd5e1;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--primary-color);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .item-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-heading);
        }

        .item-sub {
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .item-date {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .project-card {
            background-color: var(--accent-blue);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 16px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .project-name {
            font-weight: 700;
            color: var(--text-heading);
            font-size: 1rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-name i {
            color: var(--primary-color);
            font-size: 0.85rem;
        }

        .project-desc {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: white;
            color: #1e293b;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #cbd5e1;
        }

        .tag.highlight {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
